name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version number for the new release
        required: true
        default: v1.0.0
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the HDR Flicker Fix
        run: |
          cp LICENSE hdr-10bit-fix/
          tar -czf hdr-10bit-fix.tar.gz --exclude=tests --exclude=__pycache__ hdr-10bit-fix
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" hdr-10bit-fix.tar.gz --clobber
          else
            gh release create "$TAG" hdr-10bit-fix.tar.gz --target "$GITHUB_SHA" --title "$TAG" --notes-file .github/release-notes.md
          fi
