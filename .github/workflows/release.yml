name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the HDR Flicker Fix
        run: |
          cp LICENSE hdr-10bit-fix/
          tar -czf hdr-10bit-fix.tar.gz --exclude=tests --exclude=__pycache__ hdr-10bit-fix
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" hdr-10bit-fix.tar.gz --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md
