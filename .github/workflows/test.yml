name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Check the shell script
        run: shellcheck hdr-10bit-fix/edid-10bpc.sh
      - name: Run the EDID tests
        run: python3 -m unittest discover -s hdr-10bit-fix/tests -v
